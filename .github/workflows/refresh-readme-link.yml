name: Refresh Access Gateway README in release ZIP

on:
  push:
    paths:
      - '.github/workflows/refresh-readme-link.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh README in release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r /tmp/u
          tag="$(gh release view --json tagName -q .tagName)"
          gh release download "$tag" --pattern '*.zip' --dir /tmp/r
          z="$(find /tmp/r -maxdepth 1 -type f -name '*.zip' | head -n1)"
          unzip -q "$z" -d /tmp/u
          composer="$(find /tmp/u -type f -name composer.json -printf '%d %p\n' | sort -n | head -n1 | cut -d' ' -f2-)"
          pkgdir="$(dirname "$composer")"
          cp README.md "$pkgdir/README.md"
          cd /tmp/u
          zip -qr /tmp/new.zip .
          asset="$(basename "$z")"
          mv /tmp/new.zip "/tmp/$asset"
          cd "$GITHUB_WORKSPACE"
          gh release upload "$tag" "/tmp/$asset" --clobber
          if [ -f "downloads/$asset" ]; then
            cp "/tmp/$asset" "downloads/$asset"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "downloads/$asset"
            git commit -m "Sync release ZIP README" || true
            git push
          fi
          echo "RESULT=SYNCED"
