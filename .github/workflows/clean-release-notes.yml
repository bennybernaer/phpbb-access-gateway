name: Clean release ZIP release notes

on:
  push:
    paths:
      - '.github/workflows/clean-release-notes.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant release notes from release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r /tmp/u
          tag="$(gh release view --json tagName -q .tagName)"
          gh release download "$tag" --pattern '*.zip' --dir /tmp/r
          z="$(find /tmp/r -maxdepth 1 -type f -name '*.zip' | head -n1)"
          asset="$(basename "$z")"
          unzip -q "$z" -d /tmp/u
          find /tmp/u -type f \( -name 'RELEASE_NOTES_1.0.0.md' -o -name 'RELEASE_NOTES_1.0.1.md' \) -print -delete
          cd /tmp/u
          zip -qr "/tmp/$asset" .
          cd "$GITHUB_WORKSPACE"
          gh release upload "$tag" "/tmp/$asset" --clobber
          if [ -f "downloads/$asset" ]; then
            cp "/tmp/$asset" "downloads/$asset"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "downloads/$asset"
            git commit -m "Clean release ZIP release notes" || true
            git push
          fi
